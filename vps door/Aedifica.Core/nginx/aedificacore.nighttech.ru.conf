# Nginx для aedificacore.nighttech.ru
# local_api слушает 127.0.0.1:84 (web + API в одном процессе).
#
# Установка:
#   sudo cp "vps door/Aedifica.Core/nginx/aedificacore.nighttech.ru.conf" \
#     /etc/nginx/sites-available/aedificacore.nighttech.ru
#   sudo ln -sf /etc/nginx/sites-available/aedificacore.nighttech.ru \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL:
#   sudo certbot --nginx -d aedificacore.nighttech.ru

server {
    listen 80;
    listen [::]:80;
    server_name aedificacore.nighttech.ru;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:84;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/aedificacore.nighttech.ru.access.log;
    error_log  /var/log/nginx/aedificacore.nighttech.ru.error.log;
}
