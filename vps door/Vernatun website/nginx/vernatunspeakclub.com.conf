#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#     return 301 https://vernatunspeakclub.com$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name vernatunspeakclub.com www.vernatunspeakclub.com;
    return 301 https://vernatunspeakclub.com$request_uri;
}
