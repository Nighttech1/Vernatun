# Vernatun Armenian Club — static site
# App root: /home/infinity/Vernatun website/web
# Internal port: 85 (direct static), 443 (HTTPS public)
#
# Install:
#   sudo cp "vps door/Vernatun website/nginx/vernatunspeakclub.com.conf" \
#     /etc/nginx/sites-available/vernatunspeakclub.com
#   sudo ln -sf /etc/nginx/sites-available/vernatunspeakclub.com \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL:
#   sudo certbot --nginx -d vernatunspeakclub.com

server {
    listen 85;
    listen [::]:85;
    server_name vernatunspeakclub.com www.vernatunspeakclub.com;

    root "/home/infinity/Vernatun website/web";
    index index.html;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|mp4|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/vernatunspeakclub.com.access.log;
    error_log  /var/log/nginx/vernatunspeakclub.com.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vernatunspeakclub.com www.vernatunspeakclub.com;

    root "/home/infinity/Vernatun website/web";
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vernatunspeakclub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vernatunspeakclub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|mp4|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/vernatunspeakclub.com.access.log;
    error_log  /var/log/nginx/vernatunspeakclub.com.error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name vernatunspeakclub.com www.vernatunspeakclub.com;

    return 301 https://vernatunspeakclub.com$request_uri;
}
